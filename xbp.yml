probes:
- name: athena-db
  url: https://athena-db.com
  http_method: GET
  with:
    headers:
      user-agent: XBP Probe/0.9.4
  expectations:
  - field: StatusCode
    operation: Equals
    value: "200"
  schedule:
    initial_delay: 0
    interval: 60
  alerts:
  - url: https://webhook.site/32016ae5-c886-4a96-b2d8-1b10907f41c8
  tags:
    system: athena
    component: athena-db
    owner: floris@xylex.group

