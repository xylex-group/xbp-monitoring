services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xbp-monitoring-backend
    ports:
      - "3000:3000"
      - "9464:9464"
    env_file:
      - .env
    volumes:
      - ./xbp.yml:/app/xbp.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: xbp-monitoring-app
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
    ports:
      - "3001:80"
    restart: unless-stopped
